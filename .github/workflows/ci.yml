name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests, fixture evals and the end-to-end run never call the model; demo mode needs no key.
      ANTHROPIC_API_KEY: ""
      NEXT_TELEMETRY_DISABLED: "1"
      # Only used to decide whether the live eval step runs; it is empty when the secret does not exist.
      LIVE_EVALS_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # package.json depends on file:../ui, so the component library has to sit next to this checkout.
      # actions/checkout cannot write outside the workspace, so check it out here and move it up a level.
      - uses: actions/checkout@v4
        with:
          repository: eylulg/ui
          path: ui-src

      - name: Build the component library
        run: |
          mv ui-src ../ui
          npm --prefix ../ui ci
          npm --prefix ../ui run build

      - run: npm ci

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm test

      - name: Evals on recorded transcripts
        run: npm run eval

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (demo mode)
        run: npm run test:e2e

      - name: Live evals
        # Secrets are not available to pull requests from forks, and there is no secret until it is added to the repository.
        # Without it this step is skipped. With it, the run stops starting cases once EVAL_BUDGET_USD is spent.
        if: ${{ env.LIVE_EVALS_KEY != '' }}
        run: npm run eval:live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_BUDGET_USD: "0.50"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
